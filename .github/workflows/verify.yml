name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cogniNote-agent-front/package-lock.json
      - run: npm --prefix cogniNote-agent-front ci
      - run: npm --prefix cogniNote-agent-front run test

  frontend-build:
    name: Frontend build and budget
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cogniNote-agent-front/package-lock.json
      - run: npm --prefix cogniNote-agent-front ci
      - run: npm --prefix cogniNote-agent-front run build
      - run: node scripts/check-frontend-bundle-budget.mjs

  browser-smoke:
    name: Browser smoke
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cogniNote-agent-front/package-lock.json
      - run: npm --prefix cogniNote-agent-front ci
      - run: npm --prefix cogniNote-agent-front exec -- playwright install --with-deps chromium
      - run: npm --prefix cogniNote-agent-front run test:e2e
      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: artifacts/browser-smoke/
          if-no-files-found: warn

  knowledge-smoke:
    name: Knowledge smoke
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - shell: pwsh
        run: ./scripts/smoke-knowledge-health.ps1
      - name: Upload knowledge smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-smoke-artifacts
          path: artifacts/knowledge-smoke/
          if-no-files-found: warn
